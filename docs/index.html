<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <style>
      :root {
        color-scheme: light;
        --bg: #edf3f8;
        --panel: rgba(251, 253, 255, 0.9);
        --line: rgba(81, 104, 127, 0.16);
        --text: #172534;
        --muted: #637487;
        --accent: #1f5f91;
        --accent-strong: #174a71;
        --good: #dcefe3;
        --warn: #fff0d0;
        --risk: #ffe7df;
        --shadow: 0 18px 48px rgba(40, 61, 83, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(180, 210, 231, 0.35), transparent 26%),
          radial-gradient(circle at bottom right, rgba(196, 220, 236, 0.28), transparent 30%),
          linear-gradient(180deg, #eef4f8 0%, #dfe8ee 100%);
        min-height: 100vh;
      }

      .shell {
        max-width: 1320px;
        margin: 0 auto;
        padding: 28px;
      }

      .hero {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        align-items: flex-start;
        margin-bottom: 20px;
      }

      .eyebrow {
        font-size: 12px;
        letter-spacing: 0.18em;
        color: var(--accent);
        text-transform: uppercase;
      }

      h1 {
        margin: 8px 0 12px;
        font-size: clamp(2rem, 3vw, 3rem);
        font-family: "Georgia", "Noto Serif SC", serif;
      }

      .hero p {
        margin: 0;
        max-width: 760px;
        color: var(--muted);
        line-height: 1.7;
      }

      .hero-side {
        min-width: 240px;
        padding: 18px;
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 22px;
        box-shadow: var(--shadow);
      }

      .hero-side strong {
        display: block;
        font-size: 14px;
        margin-bottom: 10px;
      }

      .hero-side a {
        color: var(--accent-strong);
        text-decoration: none;
        word-break: break-all;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 14px;
        margin-bottom: 18px;
      }

      .metric {
        padding: 16px;
        border-radius: 20px;
        border: 1px solid var(--line);
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .metric small {
        display: block;
        color: var(--muted);
        margin-bottom: 8px;
      }

      .metric strong {
        font-size: 1.9rem;
        font-family: "Georgia", "Noto Serif SC", serif;
      }

      .workspace {
        display: grid;
        grid-template-columns: 1fr 1.15fr 1.15fr;
        gap: 18px;
      }

      .panel {
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 24px;
        box-shadow: var(--shadow);
        padding: 18px;
      }

      .panel h2 {
        margin: 0 0 6px;
        font-size: 1.16rem;
      }

      .panel-subtitle {
        color: var(--muted);
        font-size: 0.92rem;
        margin-bottom: 14px;
      }

      .card,
      .selector,
      .match-card {
        border: 1px solid var(--line);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.78);
      }

      .card,
      .match-card {
        padding: 14px;
      }

      .card + .card,
      .selector + .selector,
      .match-card + .match-card {
        margin-top: 12px;
      }

      .selector {
        width: 100%;
        text-align: left;
        padding: 12px 14px;
        cursor: pointer;
        transition: transform 140ms ease, border-color 140ms ease, background 140ms ease;
      }

      .selector:hover,
      .selector.active {
        transform: translateY(-1px);
        border-color: rgba(31, 95, 145, 0.28);
        background: rgba(241, 247, 252, 0.96);
      }

      .selector strong {
        display: block;
      }

      .selector small,
      .muted,
      .reason-list li,
      .tag,
      .score-grid span {
        color: var(--muted);
      }

      .summary-title {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
        margin-bottom: 10px;
      }

      .summary-title strong {
        font-size: 1.12rem;
      }

      .chip,
      .score-pill,
      .intent-pill,
      .tag {
        border-radius: 999px;
        border: 1px solid var(--line);
      }

      .chip,
      .intent-pill {
        padding: 8px 12px;
        font-size: 0.84rem;
      }

      .chip {
        background: rgba(227, 238, 246, 0.92);
        color: var(--accent-strong);
      }

      .intent-pill.active {
        background: var(--good);
        color: #276347;
      }

      .intent-pill.open {
        background: var(--warn);
        color: #8b6723;
      }

      .intent-pill.steady {
        background: rgba(242, 244, 247, 0.95);
        color: var(--muted);
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }

      .tag {
        padding: 7px 11px;
        background: rgba(246, 249, 252, 0.94);
        font-size: 0.82rem;
      }

      .principles {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 10px;
      }

      .principles li,
      .reason-list li {
        padding: 10px 12px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.8);
      }

      .match-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
      }

      .score-pill {
        min-width: 56px;
        text-align: center;
        padding: 10px 12px;
        font-weight: 700;
      }

      .score-pill.high {
        background: var(--good);
        color: #276347;
      }

      .score-pill.mid {
        background: var(--warn);
        color: #8b6723;
      }

      .score-pill.low {
        background: var(--risk);
        color: #a64b2d;
      }

      .score-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin: 14px 0;
      }

      .score-grid div {
        padding: 10px 12px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: rgba(246, 250, 253, 0.92);
      }

      .score-grid strong {
        display: block;
        margin-top: 4px;
      }

      .reason-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .reason-block {
        padding: 12px;
        border-radius: 16px;
        border: 1px solid var(--line);
        background: rgba(251, 253, 255, 0.92);
      }

      .reason-block strong {
        display: block;
        margin-bottom: 8px;
      }

      .reason-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 8px;
      }

      .footer-note {
        margin-top: 18px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      @media (max-width: 1180px) {
        .metrics,
        .workspace {
          grid-template-columns: 1fr;
        }

        .hero {
          flex-direction: column;
        }

        .reason-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

      }

      function renderJobSummary() {
        const job = workspace.jobs.find((item) => item.id === currentJobId);
        document.getElementById("job-summary").innerHTML = `
          <div class="summary-title">
            <div>
              <strong>${job.title}</strong>
              <div class="muted">${job.dept} · ${job.location} · ${job.level}</div>
            </div>
            <span class="chip">${job.priority}</span>
          </div>
          <div class="muted">重点职责：${job.responsibilities.join("、")}</div>
          <div class="tags">${job.keywords.map((item) => `<span class="tag">${item}</span>`).join("")}</div>
        `;
      }

      function renderEmployeeSummary() {
        const employee = workspace.employees.find((item) => item.id === currentEmployeeId);
        document.getElementById("employee-summary").innerHTML = `
          <div class="summary-title">
            <div>
              <strong>${employee.name}</strong>
              <div class="muted">${employee.role} · ${employee.org}</div>
            </div>
            <span class="intent-pill ${employee.mobilityIntent}">
              ${employee.mobilityIntent === "active" ? "主动流动" : employee.mobilityIntent === "open" ? "开放机会" : "暂稳"}
            </span>
          </div>
          <div class="muted">目标方向：${employee.preferredFunctions.join("、")}；期望城市：${employee.preferredCities.join("、")}</div>
          <div class="tags">${employee.skills.map((item) => `<span class="tag">${item}</span>`).join("")}</div>
        `;
      }

      function renderJobList() {
        document.getElementById("job-list").innerHTML = workspace.jobs
          .map(
            (job) => `
              <button class="selector ${job.id === currentJobId ? "active" : ""}" onclick="selectJob('${job.id}')">
                <strong>${job.title}</strong>
                <small>${job.dept} · ${job.location} · ${job.level}</small>
              </button>
            `
          )
          .join("");
      }

      function renderEmployeeList() {
        document.getElementById("employee-list").innerHTML = workspace.employees
          .map(
            (employee) => `
              <button class="selector ${employee.id === currentEmployeeId ? "active" : ""}" onclick="selectEmployee('${employee.id}')">
                <strong>${employee.name}</strong>
                <small>${employee.role} · ${employee.mobilityIntent === "active" ? "主动流动" : "开放机会"}</small>
              </button>
            `
          )
          .join("");
      }

      function renderMatchCard(match) {
        return `
          <div class="match-card">
            <div class="match-head">
              <div>
                <strong>${match.targetLabel}</strong>
                <div class="muted" style="margin-top: 4px;">${match.note}</div>
              </div>
              <span class="score-pill ${scoreTone(match.overallScore)}">${match.overallScore}</span>
            </div>
            <div class="score-grid">
              <div><span>技能</span><strong>${match.skillScore}</strong></div>
              <div><span>经历</span><strong>${match.experienceScore}</strong></div>
              <div><span>意愿</span><strong>${match.intentScore}</strong></div>
            </div>
            <div class="reason-grid">
              <div class="reason-block">
                <strong>为什么匹配</strong>
                <ul class="reason-list">${match.reasons.map((item) => `<li>${item}</li>`).join("")}</ul>
              </div>
              <div class="reason-block">
                <strong>风险与差距</strong>
                <ul class="reason-list">${match.risks.map((item) => `<li>${item}</li>`).join("")}</ul>
              </div>
            </div>
          </div>
        `;
      }

      function renderJobMatches() {
        const matches = workspace.jobMatches[currentJobId] || [];
        document.getElementById("job-matches").innerHTML = matches.map(renderMatchCard).join("");
      }

      function renderEmployeeMatches() {
        const matches = workspace.employeeMatches[currentEmployeeId] || [];
        document.getElementById("employee-matches").innerHTML = matches.map(renderMatchCard).join("");
      }

      function renderAll() {
        renderMetrics();
        renderPrinciples();
        renderJobSummary();
        renderEmployeeSummary();
        renderJobList();
        renderEmployeeList();
        renderJobMatches();
        renderEmployeeMatches();
      }

      function selectJob(jobId) {
        currentJobId = jobId;
        renderAll();
      }

      function selectEmployee(employeeId) {
        currentEmployeeId = employeeId;
        renderAll();
      }

      window.selectJob = selectJob;
      window.selectEmployee = selectEmployee;
      renderAll();
    </script>
  </body>
</html>
